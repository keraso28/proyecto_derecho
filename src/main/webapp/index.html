<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Análisis Penal</title>
    <!-- Conexión a tu archivo de estilos -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Análisis Jurídico de Expedientes</h1>
        <p>Motor de evaluación de prescripción de delitos</p>
    </header>

    <main>
        <section class="upload-section">
            <h2>Cargar Expediente (PDF)</h2>
            <form id="formulario-analisis">
                <input type="file" id="archivoPdf" accept=".pdf" required>
                <button type="submit">Iniciar Análisis Automático</button>
            </form>
        </section>

        <section class="results-section" id="panel-resultados" style="display: none;">
            <h2>Resultados del Análisis</h2>
            <div id="contenido-resultado">
                <!-- Aquí se inyectarán los datos desde Java/JavaScript -->
            </div>
        </section>
    </main>

    <!-- Conexión a tu archivo de lógica de interfaz -->
    <script src="js/main.js"></script>
</body>
</html>
